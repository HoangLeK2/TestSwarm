apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.6'
    }
}

android {
    compileSdk 36

    def releaseKeystore = file('keys/release.keystore')
    signingConfigs {
        debug {
            storeFile file('keys/debug.keystore')
            storePassword 'insecure-store-password'
            keyAlias 'STFDebugKey'
            keyPassword 'insecure-key-password'
        }
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: 'android'
                keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: 'stfrelease'
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: 'android'
            } else {
                storeFile file('keys/debug.keystore')
                storePassword 'insecure-store-password'
                keyAlias 'STFDebugKey'
                keyPassword 'insecure-key-password'
            }
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 15
        versionName "2.5.5"
        applicationId "jp.co.cyberagent.stf"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    flavorDimensions += "variant"
    productFlavors {
        lite {
            dimension = "variant"
            applicationIdSuffix = ""
            versionNameSuffix = "-lite"
        }
        full {
            dimension = "variant"
            applicationIdSuffix = ""
            versionNameSuffix = "-full"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    namespace 'jp.co.cyberagent.stf'
    lint {
        informational 'ExpiredTargetSdkVersion'
    }

}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.protobuf:protobuf-lite:3.0.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

import org.apache.tools.ant.taskdefs.condition.Os
def archSuffix = Os.isFamily(Os.FAMILY_MAC) ? ':osx-x86_64' : ''
protobuf {
    protoc {
      artifact = "com.google.protobuf:protoc:3.21.12$archSuffix"
    }
    plugins {
      javalite {
        artifact = "com.google.protobuf:protoc-gen-javalite:3.0.0$archSuffix"
      }
    }
    generateProtoTasks {
      all().each { task ->
        task.plugins {
          javalite {}
        }
      }
    }
}
