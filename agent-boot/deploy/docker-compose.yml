# Offline bundle: load image first (./scripts/docker-load.sh), then compose up.
#   ./scripts/docker-up.sh up -d

name: agent-boot

services:
  agent-boot:
    image: agent-boot:0.3.0
    container_name: agent-boot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_API_KEY: ${RELAY_API_KEY:?configure RELAY_API_KEY in .env}
      RELAY_ENROLLMENT_TOKEN: ${RELAY_ENROLLMENT_TOKEN:?configure RELAY_ENROLLMENT_TOKEN in .env}
      ADB_HOST: ${ADB_HOST:-host.docker.internal}
      ADB_PORT: ${ADB_PORT:-5037}
      ADB_SERVER_SOCKET: "tcp:${ADB_HOST:-host.docker.internal}:${ADB_PORT:-5037}"
      ADB_SERVER_SOCKETS: ${ADB_SERVER_SOCKETS:-}
      ANDROID_ADB_SERVER_HOST: ${ADB_HOST:-host.docker.internal}
      ANDROID_ADB_SERVER_PORT: ${ADB_PORT:-5037}
      AGENT_BOOT_STATE_DIR: /app/state
      MEDIA_ADAPTER_ENABLED: "0"
      MEDIA_ADAPTER_AUTOSTART: "0"
    depends_on:
      - media-adapter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535
    volumes:
      # Bind mount, not a named volume: the server-issued relay id lives here and
      # must survive `down -v` and image upgrades, or the machine re-enrolls.
      - ./state:/app/state
    # Optional: mount custom APKs/binaries over baked-in /app/assets
    # volumes:
    #   - ./assets:/app/assets:ro

  media-adapter:
    image: agent-boot:0.3.0
    container_name: media-adapter
    restart: unless-stopped
    command: ["/app/bin/media-adapter"]
    environment:
      # scrcpy-server's own output is logged at Debug, so at the default Info
      # level a device that refuses to encode shows up only as "handshake not
      # ready ... EOF" with no reason. Set MEDIA_ADAPTER_LOG_LEVEL=debug in
      # .env, restart, and send the media-adapter logs when a phone will not
      # stream. This service has no env_file, so the knob must be listed here.
      MEDIA_ADAPTER_LOG_LEVEL: ${MEDIA_ADAPTER_LOG_LEVEL:-info}
      ADB_HOST: ${ADB_HOST:-host.docker.internal}
      ADB_PORT: ${ADB_PORT:-5037}
      ADB_SERVER_SOCKET: "tcp:${ADB_HOST:-host.docker.internal}:${ADB_PORT:-5037}"
      ADB_SERVER_SOCKETS: ${ADB_SERVER_SOCKETS:-}
      ANDROID_ADB_SERVER_HOST: ${ADB_HOST:-host.docker.internal}
      ANDROID_ADB_SERVER_PORT: ${ADB_PORT:-5037}
      MEDIA_ADAPTER_ENABLED: ${MEDIA_ADAPTER_ENABLED:-1}
      MEDIA_ADAPTER_AUTOSTART: "0"
      MEDIA_ADAPTER_DIRECT_SCRCPY_ENABLED: ${MEDIA_ADAPTER_DIRECT_SCRCPY_ENABLED:-1}
      MEDIA_ADAPTER_HTTP_BIND: ${MEDIA_ADAPTER_HTTP_BIND:-0.0.0.0}
      MEDIA_ADAPTER_HTTP_PORT: ${MEDIA_ADAPTER_HTTP_PORT:-8878}
      MEDIA_ADAPTER_RTSP_ADDRESS: ":8556"
      # This machine is behind NAT; the server cannot dial in. Push H264 into
      # the server's go2rtc over RTSP instead — outbound, so NAT is a non-issue.
      MEDIA_ADAPTER_GO2RTC_RTSP_PUBLISH_TEMPLATE: ${MEDIA_ADAPTER_GO2RTC_RTSP_PUBLISH_TEMPLATE:?e.g. rtsp://USER:PASS@farm.example.com:8554/{stream_raw}}
      # Must stay 0 while publishing: RegisterStream would PUT a *pull* src into
      # go2rtc, pointing at this machine's :8556 — unreachable from the server,
      # and fighting the publisher for the same stream name.
      MEDIA_ADAPTER_GO2RTC_REGISTER_ENABLED: ${MEDIA_ADAPTER_GO2RTC_REGISTER_ENABLED:-0}
      MEDIA_ADAPTER_GO2RTC_RTSP_SOURCE_TEMPLATE: ${MEDIA_ADAPTER_GO2RTC_RTSP_SOURCE_TEMPLATE:-rtsp://host.docker.internal:8556/{stream_raw}}
      MEDIA_ADAPTER_CONTROL_GRPC_ENABLED: ${MEDIA_ADAPTER_CONTROL_GRPC_ENABLED:-1}
      # No localhost default here: this machine is not the server. Falling back
      # to host.docker.internal would dial nothing and fail silently, so demand
      # the address instead.
      MEDIA_ADAPTER_CONTROL_GRPC_SERVER: ${MEDIA_ADAPTER_CONTROL_GRPC_SERVER:?e.g. grpc-device-farm.example.com:443}
      MEDIA_ADAPTER_CONTROL_GRPC_TLS: ${MEDIA_ADAPTER_CONTROL_GRPC_TLS:-false}
      MEDIA_ADAPTER_CONTROL_GRPC_ROOT_CERT_FILE: ${MEDIA_ADAPTER_CONTROL_GRPC_ROOT_CERT_FILE:-}
      MEDIA_ADAPTER_CONTROL_GRPC_API_KEY: ${RELAY_API_KEY:?configure RELAY_API_KEY in .env}
      MEDIA_ADAPTER_CONTROL_GRPC_ENROLLMENT_TOKEN: ${RELAY_ENROLLMENT_TOKEN:?configure RELAY_ENROLLMENT_TOKEN in .env}
      MEDIA_ADAPTER_CONTROL_HEARTBEAT_SECONDS: ${MEDIA_ADAPTER_CONTROL_HEARTBEAT_SECONDS:-5}
      MEDIA_ADAPTER_ID: ${MEDIA_ADAPTER_ID:-}
      MEDIA_ADAPTER_QUEUE_MAX: ${MEDIA_ADAPTER_QUEUE_MAX:-8}
      MEDIA_ADAPTER_STALE_PACKET_MS: ${MEDIA_ADAPTER_STALE_PACKET_MS:-1000}
      MEDIA_ADAPTER_IDR_MIN_INTERVAL_MS: ${MEDIA_ADAPTER_IDR_MIN_INTERVAL_MS:-3000}
      MEDIA_ADAPTER_LANE_IDLE_S: ${MEDIA_ADAPTER_LANE_IDLE_S:-120}
      # WHIP alternative: point the template above at go2rtc's WebRTC ingest
      # (http://.../api/webrtc?dst=STREAM) and the adapter publishes over WebRTC
      # instead. Transport is chosen by URL scheme. Buys nack — lost packets are
      # retransmitted rather than leaving the picture broken until the next
      # keyframe — at the cost of needing UDP out, which RTSP does not.
      MEDIA_ADAPTER_WHIP_ICE_SERVERS: ${MEDIA_ADAPTER_WHIP_ICE_SERVERS:-stun:stun.l.google.com:19302}
      MEDIA_ADAPTER_WHIP_TIMEOUT_MS: ${MEDIA_ADAPTER_WHIP_TIMEOUT_MS:-5000}
      MEDIA_ADAPTER_WHIP_REDIAL_MS: ${MEDIA_ADAPTER_WHIP_REDIAL_MS:-2000}
      MEDIA_ADAPTER_RTSP_WRITE_QUEUE: ${MEDIA_ADAPTER_RTSP_WRITE_QUEUE:-128}
      # Must hold one access unit. A keyframe packetises to ~85 RTP packets, so
      # the 32 this used to default to discarded every keyframe and then asked
      # for an IDR that overflowed in turn — a drop loop on a healthy uplink.
      # Overflow drains the backlog rather than sitting full, so depth costs
      # burst memory, not steady-state latency. rtspserver.New clamps below 256.
      MEDIA_ADAPTER_REMOTE_RTSP_QUEUE: ${MEDIA_ADAPTER_REMOTE_RTSP_QUEUE:-256}
      MEDIA_ADAPTER_REMOTE_RTSP_TIMEOUT_MS: ${MEDIA_ADAPTER_REMOTE_RTSP_TIMEOUT_MS:-5000}
      MEDIA_ADAPTER_INPUT_FPS: ${MEDIA_ADAPTER_INPUT_FPS:-15}
      MEDIA_ADAPTER_OWNS_SCRCPY: ${MEDIA_ADAPTER_OWNS_SCRCPY:-1}
      MEDIA_ADAPTER_SCRCPY_SERVER_PATH: ${MEDIA_ADAPTER_SCRCPY_SERVER_PATH:-/app/media-adapter/assets/scrcpy-server}
      MEDIA_ADAPTER_SCRCPY_SERVER_VERSION: ${MEDIA_ADAPTER_SCRCPY_SERVER_VERSION:-4.1}
      # scrcpy 4.x clamps resolution/fps against what the encoder declares it
      # supports. Samsung Exynos declares capabilities it will not honour, so
      # that step is what kills the launch. Note 10+ already bypasses it by
      # model detection; set this to 1 if another model shows the same silent
      # failure to stream.
      MEDIA_ADAPTER_SCRCPY_IGNORE_ENCODER_CONSTRAINTS: ${MEDIA_ADAPTER_SCRCPY_IGNORE_ENCODER_CONSTRAINTS:-0}
      # Kill switch for the per-model reduced profile (Note 10+ etc). Set 0 to
      # launch a listed device exactly like any other — the way to tell whether
      # the special-casing is the cause rather than the cure.
      MEDIA_ADAPTER_SCRCPY_DEVICE_SAFE_PROFILE: ${MEDIA_ADAPTER_SCRCPY_DEVICE_SAFE_PROFILE:-1}
      # Leave empty. Only set this to an encoder name confirmed present on the
      # device via `list_encoders=true` — pinning an unverified name is what
      # hung Note 10+ (MediaCodec.createByCodecName never returned).
      MEDIA_ADAPTER_SCRCPY_SAFE_VIDEO_ENCODER: ${MEDIA_ADAPTER_SCRCPY_SAFE_VIDEO_ENCODER:-}
      # Máy trong danh sách safe profile encode ở độ phân giải gốc vì mọi max_size
      # đều làm Exynos abort ("stack corruption detected") trong MediaCodec.
      # Chỉ điền số ở đây khi đã xác nhận một cỡ chạy được trên máy thật.
      MEDIA_ADAPTER_SCRCPY_SAFE_MAX_SIZE: ${MEDIA_ADAPTER_SCRCPY_SAFE_MAX_SIZE:-0}
      # 0 = không gửi max_fps cho máy trong danh sách. Cùng lý do với SAFE_MAX_SIZE:
      # scrcpy dịch max_fps thành key vendor max-fps-to-encoder, và riêng nó cũng
      # đủ làm encoder Exynos abort.
      MEDIA_ADAPTER_SCRCPY_SAFE_MAX_FPS: ${MEDIA_ADAPTER_SCRCPY_SAFE_MAX_FPS:-0}
      # Thu nho CHINH MAN HINH may thay vi bat encoder scale (scale la thu lam
      # Exynos abort). Vi du: 720x1480. De trong = khong dung toi may.
      # Day la thay doi THAT va co tinh luu lai tren may: app hien thi khac, va
      # automation dua tren toa do tuyet doi se lech. Hoan tac: wm size reset.
      MEDIA_ADAPTER_SCRCPY_SAFE_DISPLAY_SIZE: ${MEDIA_ADAPTER_SCRCPY_SAFE_DISPLAY_SIZE:-}
    ports:
      - "127.0.0.1:${MEDIA_ADAPTER_HTTP_PORT:-8878}:8878/tcp"
      - "${MEDIA_ADAPTER_RTSP_PORT:-8556}:8556/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535
