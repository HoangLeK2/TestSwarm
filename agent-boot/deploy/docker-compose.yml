# Offline bundle: load image first (./scripts/docker-load.sh), then compose up.
#   ./scripts/docker-up.sh up -d

name: agent-boot

services:
  agent-boot:
    image: agent-boot:0.1.0
    container_name: agent-boot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ADB_HOST: host.docker.internal
      ADB_PORT: "5037"
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
      ANDROID_ADB_SERVER_HOST: host.docker.internal
      ANDROID_ADB_SERVER_PORT: "5037"
    extra_hosts:
      - "host.docker.internal:host-gateway"
