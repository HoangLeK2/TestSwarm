# agent-boot — local source Docker Compose.
#
# Standard mode: USB/ADB stays on the host; containers call host ADB via
# host.docker.internal:5037. Compose uses one image with two containers so relay
# logs and media logs stay separated.

name: agent-boot

x-agent-boot-image: &agent-boot-image
  build:
    context: .
    dockerfile: Dockerfile
  image: agent-boot:0.2.4

x-adb-host-env: &adb-host-env
  ADB_HOST: host.docker.internal
  ADB_PORT: "5037"
  ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
  ADB_SERVER_SOCKETS: "${ADB_SERVER_SOCKETS:-tcp:host.docker.internal:5037,tcp:host.docker.internal:5038}"
  ANDROID_ADB_SERVER_HOST: host.docker.internal
  ANDROID_ADB_SERVER_PORT: "5037"

x-media-env: &media-env
  MEDIA_ADAPTER_ENABLED: "${MEDIA_ADAPTER_ENABLED:-1}"
  MEDIA_ADAPTER_AUTOSTART: "0"
  MEDIA_ADAPTER_DIRECT_SCRCPY_ENABLED: "${MEDIA_ADAPTER_DIRECT_SCRCPY_ENABLED:-1}"

services:
  agent-boot:
    <<: *agent-boot-image
    container_name: agent-boot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *adb-host-env
      RELAY_API_KEY: "${RELAY_API_KEY:?configure RELAY_API_KEY in .env}"
      RELAY_ENROLLMENT_TOKEN: "${RELAY_ENROLLMENT_TOKEN:?configure RELAY_ENROLLMENT_TOKEN in .env}"
      AGENT_BOOT_CONTENT_DATABASE_URL: "${AGENT_BOOT_CONTENT_DATABASE_URL:?configure AGENT_BOOT_CONTENT_DATABASE_URL in .env}"
      MEDIA_ADAPTER_ENABLED: "0"
      MEDIA_ADAPTER_AUTOSTART: "0"
    depends_on:
      - media-adapter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535

  media-adapter:
    <<: *agent-boot-image
    container_name: media-adapter
    restart: unless-stopped
    command: ["/app/bin/media-adapter"]
    environment:
      <<: [*adb-host-env, *media-env]
      # scrcpy-server's own output is logged at Debug (launcher.go logAndWait),
      # so at the default Info level the device's actual error is discarded and
      # a failed start only shows as "handshake not ready ... EOF". Set this to
      # `debug` when diagnosing a device that refuses to stream.
      MEDIA_ADAPTER_LOG_LEVEL: "${MEDIA_ADAPTER_LOG_LEVEL:-info}"
      MEDIA_ADAPTER_HTTP_BIND: "${MEDIA_ADAPTER_HTTP_BIND:-0.0.0.0}"
      MEDIA_ADAPTER_HTTP_PORT: "${MEDIA_ADAPTER_HTTP_PORT:-8878}"
      MEDIA_ADAPTER_RTSP_ADDRESS: "${MEDIA_ADAPTER_RTSP_ADDRESS:-:8556}"
      # Push H264 into go2rtc over RTSP. This is the only direction that works
      # once go2rtc lives on a server and this adapter sits behind NAT, so dev
      # uses the same path as prod — only the host in the template differs.
      MEDIA_ADAPTER_GO2RTC_RTSP_PUBLISH_TEMPLATE: "${MEDIA_ADAPTER_GO2RTC_RTSP_PUBLISH_TEMPLATE:-rtsp://${RTSP_USER:-farm}:${RTSP_PASS:-change-me}@host.docker.internal:8554/{stream_raw}}"
      # Must stay 0 while publishing: RegisterStream would PUT a *pull* src into
      # go2rtc, and go2rtc would dial back out on the same stream name that the
      # publisher owns.
      MEDIA_ADAPTER_GO2RTC_REGISTER_ENABLED: "${MEDIA_ADAPTER_GO2RTC_REGISTER_ENABLED:-0}"
      MEDIA_ADAPTER_GO2RTC_RTSP_SOURCE_TEMPLATE: "${MEDIA_ADAPTER_GO2RTC_RTSP_SOURCE_TEMPLATE:-rtsp://host.docker.internal:8556/{stream_raw}}"
      MEDIA_ADAPTER_CONTROL_GRPC_ENABLED: "${MEDIA_ADAPTER_CONTROL_GRPC_ENABLED:-1}"
      MEDIA_ADAPTER_CONTROL_GRPC_SERVER: "${MEDIA_ADAPTER_CONTROL_GRPC_SERVER:-host.docker.internal:50051}"
      MEDIA_ADAPTER_CONTROL_GRPC_TLS: "${MEDIA_ADAPTER_CONTROL_GRPC_TLS:-false}"
      MEDIA_ADAPTER_CONTROL_GRPC_ROOT_CERT_FILE: "${MEDIA_ADAPTER_CONTROL_GRPC_ROOT_CERT_FILE:-}"
      MEDIA_ADAPTER_CONTROL_GRPC_API_KEY: "${RELAY_API_KEY:?configure RELAY_API_KEY in .env}"
      MEDIA_ADAPTER_CONTROL_GRPC_ENROLLMENT_TOKEN: "${RELAY_ENROLLMENT_TOKEN:?configure RELAY_ENROLLMENT_TOKEN in .env}"
      MEDIA_ADAPTER_ID: "${MEDIA_ADAPTER_ID:-}"
      MEDIA_ADAPTER_QUEUE_MAX: "${MEDIA_ADAPTER_QUEUE_MAX:-8}"
      MEDIA_ADAPTER_STALE_PACKET_MS: "${MEDIA_ADAPTER_STALE_PACKET_MS:-160}"
      MEDIA_ADAPTER_RTSP_WRITE_QUEUE: "${MEDIA_ADAPTER_RTSP_WRITE_QUEUE:-128}"
      # Shallow on purpose: a deep queue sits full when the uplink is the
      # bottleneck, leaving the reader permanently that many packets behind.
      MEDIA_ADAPTER_REMOTE_RTSP_QUEUE: "${MEDIA_ADAPTER_REMOTE_RTSP_QUEUE:-32}"
      MEDIA_ADAPTER_REMOTE_RTSP_TIMEOUT_MS: "${MEDIA_ADAPTER_REMOTE_RTSP_TIMEOUT_MS:-1500}"
      MEDIA_ADAPTER_INPUT_FPS: "${MEDIA_ADAPTER_INPUT_FPS:-15}"
      MEDIA_ADAPTER_OWNS_SCRCPY: "${MEDIA_ADAPTER_OWNS_SCRCPY:-1}"
      MEDIA_ADAPTER_SCRCPY_SERVER_PATH: "${MEDIA_ADAPTER_SCRCPY_SERVER_PATH:-/app/media-adapter/assets/scrcpy-server}"
      MEDIA_ADAPTER_SCRCPY_SERVER_VERSION: "${MEDIA_ADAPTER_SCRCPY_SERVER_VERSION:-4.1}"
      # Bypass scrcpy 4.x's clamp of resolution/fps against the encoder's
      # declared capabilities. Note 10+ enables it by model detection; this is
      # the fleet-wide switch for another model showing the same failure.
      MEDIA_ADAPTER_SCRCPY_IGNORE_ENCODER_CONSTRAINTS: "${MEDIA_ADAPTER_SCRCPY_IGNORE_ENCODER_CONSTRAINTS:-0}"
      # Kill switch for the per-model reduced profile (Note 10+ etc). Set 0 to
      # launch a listed device exactly like any other — the way to tell whether
      # the special-casing is the cause rather than the cure.
      MEDIA_ADAPTER_SCRCPY_DEVICE_SAFE_PROFILE: "${MEDIA_ADAPTER_SCRCPY_DEVICE_SAFE_PROFILE:-1}"
      # Leave empty unless an encoder name was confirmed via list_encoders=true.
      MEDIA_ADAPTER_SCRCPY_SAFE_VIDEO_ENCODER: "${MEDIA_ADAPTER_SCRCPY_SAFE_VIDEO_ENCODER:-}"
      # 0 = không thu nhỏ (độ phân giải gốc). Xem safeProfileMaxSize.
      MEDIA_ADAPTER_SCRCPY_SAFE_MAX_SIZE: "${MEDIA_ADAPTER_SCRCPY_SAFE_MAX_SIZE:-0}"
      MEDIA_ADAPTER_SCRCPY_SAFE_MAX_FPS: "${MEDIA_ADAPTER_SCRCPY_SAFE_MAX_FPS:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MEDIA_ADAPTER_HTTP_PORT:-8878}:8878/tcp"
      - "${MEDIA_ADAPTER_RTSP_PORT:-8556}:8556/tcp"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535
