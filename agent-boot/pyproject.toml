[project]
name = "agent"
version = "0.2.8"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "websockets>=12.0",
    "zeroconf>=0.149.16",
    "rich>=13.0",
    # adb operations use subprocess (system adb binary) — no ppadb dependency
    "grpcio>=1.80.0",
    "protobuf>=5.26.0",
    "uiautomator2>=3.0",
    # stability: retry + circuit-breaker for scrcpy / u2 / adb recovery loops
    "tenacity>=9.0.0",
    "aiobreaker>=1.2.0",
    "asyncpg>=0.30.0,<0.31",
    "dateparser>=1.2",
    "ftfy>=6.2",
    "lxml>=6.1.0",
    # customer Docker releases must stay above the patched transitive versions
    # used by requests/uiautomator2 and their image/XML helpers.
    "idna>=3.15",
    "pillow>=12.3.0",
    # Template matching for image-based steps. headless, never contrib: we use
    # exactly one function (cv2.matchTemplate), and the contrib build links
    # libGL, which this slim image does not ship — that is what silently killed
    # the same code path on the farm side.
    "opencv-python-headless>=4.10.0",
    "urllib3>=2.7.0",
    # perf: orjson is a C-based JSON serializer that releases the GIL on dump,
    # ~5–10x faster than stdlib json. Used everywhere we serialize device
    # results so cpu_executor can run dumps in real parallel.
    "orjson>=3.10",
    "msgspec>=0.19.0",
    # perf: uvloop is a libuv-backed asyncio loop, ~2x faster than the default
    # selector loop on Linux/macOS for I/O-heavy workloads (sockets, ADB,
    # WebSocket). Installed in main.py before asyncio.run().
    "uvloop>=0.19; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
