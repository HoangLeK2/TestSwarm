[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "websockets>=12.0",
    "zeroconf>=0.131.0",
    "rich>=13.0",
    # adb operations use subprocess (system adb binary) — no ppadb dependency
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=5.26.0",
    "uiautomator2>=3.0",
    # stability: retry + circuit-breaker for scrcpy / u2 / adb recovery loops
    "tenacity>=9.0.0",
    "aiobreaker>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
