
web:
  host: "0.0.0.0"
  port: 8081
  cors_allow_all: true
  ws_ping_interval: 20  
  ws_ping_timeout: 30   


ports:
  base_port: 20000
  stride: 10

adb:
  path: "adb"            
  ping_timeout: 5
  connect_timeout: 10

device:
  # Use data/ so Docker (non-root farm user) can write; /app/data is writable in the image.
  index_file: "data/device_index.json"

  stf_package: "jp.co.cyberagent.stf"
  stf_apk_path: ""       

  scrcpy_jar: "/opt/homebrew/share/scrcpy/scrcpy-server"
  scrcpy_max_fps: 15
  scrcpy_max_width: 600
  scrcpy_bitrate: 1500000        # H.264 bitrate bps for local ADB path (1.5Mbps)
  scrcpy_relay_bitrate: 900000   # relay/WebRTC source bitrate for readable low-latency control
  scrcpy_control: true      # Keep scrcpy control socket for H264 IDR/keyframes; input still prioritizes u2
  u2_always_tunnel: false  # Local/LAN: prefer direct atx-agent on device_ip:7912 (no WS u2 tunnel)

force_u2_mode: false

# ADB relay — gRPC server for local agent-boot/relay.py
# Enable when running device_farm in cloud (devices connect via relay agents)
relay:
  enabled: true
  port: 50051
  api_key: ""   # set via RELAY_API_KEY env var
  tls_cert_file: ""  # set via RELAY_TLS_CERT_FILE for gRPC TLS
  tls_key_file: ""   # set via RELAY_TLS_KEY_FILE for gRPC TLS
  allow_insecure_grpc: true

# ─── Redis (shared state for HA) ──────────────────────────────────────────────
redis:
  enabled: false           # set true or provide REDIS_URL env to enable
  url: "redis://localhost:6379/0"
  prefix: "df:"            # key prefix to avoid collision

# ─── U2 Batch / Flow ──────────────────────────────────────────────────────────
# Push multi-step uiautomator2 actions to agent-boot in one gRPC round-trip.
# Requires agent-boot >= 2026-04-08 with U2_BATCH_ENABLED=true.
u2_batch:
  enabled: true            # Override via U2_BATCH_ENABLED env var

# Leave empty to skip app monitoring in watchdog
target_app: ""           # e.g., "com.example.mygame"

# ─── Watchdog ────────────────────────────────────────────────────────────────
watchdog:
  interval: 10           # check every N seconds
  max_retries: 3         # after this many failed reconnects → mark DEAD
  frame_stale_threshold: 5  # frame older than N seconds → unhealthy
  u2_health_timeout: 5   # seconds for d.info call

# ─── Dispatcher ───────────────────────────────────────────────────────────────
dispatcher:
  loop_interval: 0.5     # seconds between dispatch loops
  max_tasks_per_minute: 60  # rate limit per device

# ─── Task Defaults ────────────────────────────────────────────────────────────
task:
  default_timeout: 300   # seconds
  default_max_retries: 2
  default_priority: 5    # lower number = higher priority


# ─── PostgreSQL Database ──────────────────────────────────────────────────────
# Set enabled: true and configure connection details to activate DB integration.
# In Docker Compose, set DATABASE_URL on the farm service (overrides host/port/user below).
database:
  enabled: true
  host: "localhost"
  port: 5432
  name: "device_farm_local"
  user: "hoanglcpila.vn"
  password: "password"

# ─── Logging ──────────────────────────────────────────────────────────────────
# Temporal activity traces → logger "temporal_trace" (console + logs/scenario-trace.log)
# Key events: temporal_activity_start/end, temporal_thread_cancel, temporal_thread_slot_released
logging:
  level: "INFO"          
  format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"

u2:
  screenshot_interval: 0.25
  implicitly_wait: 10.0
  wait_timeout: 20.0
  operation_delay: [0, 0.1]

# ─── Streaming ──────────────────────────────────────────────────────────────
# mode: "periodic" = server captures screenshots on interval (low CPU/bandwidth)
#        "continuous" = H.264 relay (scrcpy) + optional MJPEG preview
# Relay H.264 default is ON: auto_attach_* true + DB relay_scrcpy_enabled default true.
# auto_attach_scrcpy_on_connect: false = do not start scrcpy when APK connects (lower agent-boot load).
# auto_attach_scrcpy_on_relay_online: false = do not re-start scrcpy when relay comes online.
# dashboard_grid_preview_mjpeg: false = no MJPEG on device-farm grid (saves bandwidth).
streaming:
  mode: "continuous"
  dashboard_interval: 0.1    # 10fps — scrcpy decode → JPEG cache → MJPEG endpoint
  auto_attach_scrcpy_on_connect: false
  auto_attach_scrcpy_on_relay_online: false
  dashboard_grid_preview_mjpeg: false

# Set enabled: true only when Temporal server is running.
# When disabled, campaigns fall back to the in-process TaskQueue automatically.
# Start server: docker run -p 7233:7233 temporalio/auto-setup:latest
# ─── Object storage (Cloudflare R2 — S3 API) ─────────────────────────────────
# Tạo bucket + API token (Object Read & Write) trong Cloudflare Dashboard → R2.
# endpoint: <ACCOUNT_ID>.r2.cloudflarestorage.com  (không ghi https://)
# public_base_url: URL public (custom domain hoặc *.r2.dev). Với r2.dev / domain gắn 1 bucket, đặt public_url_include_bucket: false
# Docker MinIO cục bộ: docker compose --profile minio up -d rồi set env MINIO_* hoặc object_storage bên dưới (legacy key ``minio:`` vẫn đọc được).
object_storage:
  enabled: false
  endpoint: ""                              # ví dụ: abc123def456.r2.cloudflarestorage.com
  access_key: ""                             # R2 Access Key ID
  secret_key: ""                             # R2 Secret Access Key
  bucket: "device-farm"
  secure: true
  public_base_url: ""                       # ví dụ: https://pub-xxxxx.r2.dev
  public_url_include_bucket: false          # R2 public: thường false
  region: ""                                # để trống → R2 tự dùng "auto"
# Legacy (vẫn merge được nếu bạn chưa đổi file):
# minio:
#   enabled: true
#   endpoint: "localhost:9000"
#   ...

temporal:
  enabled: true                        # Set true to use Temporal
  server_url: "localhost:7233"          # Temporal gRPC endpoint
  namespace: "default"
  task_queue: "device-scenario"
  worker_count: 7                      # Worker threads per process (each has own event loop + thread pool)
                                         # Total capacity = worker_count × worker_max_concurrent_activities
                                         # Override via TEMPORAL_WORKER_COUNT env var
                                         # 120 devices + 20 finalize/control headroom: 7 × 20 = 140 slots
  worker_max_concurrent_activities: 20  # Max parallel device actions per worker thread
  worker_max_concurrent_workflows: 60   # Max parallel workflow tasks per worker thread
  workflow_execution_timeout: 0         # 0 = unlimited (no timeout). Was 3600s.
  activity_start_to_close_timeout: 60   # Max seconds per device action
  activity_retry_max_attempts: 3        # Retry failed device actions
  activity_retry_initial_interval: 1.0  # First retry delay (seconds)
  activity_retry_max_interval: 30.0     # Max retry delay (seconds)
  activity_retry_backoff: 2.0           # Exponential backoff multiplier
