# Android Device Farm — Configuration
# All timeouts are in seconds unless noted
#
# DEPLOY LÊN SERVER (không dùng ADB):
#   Server chạy trên cloud, thiết bị chỉ cần cài STFService.apk và kết nối WebSocket.
#   Minitouch / UiAutomator: do STFService.apk cung cấp (U2CompatServer + touch a11y),
#   không cần ADB, không cần agent.py (PC). Xem device_farm/DEPLOY-NO-ADB.md.

# ─── Network ───────────────────────────────────────────────────────────────
# ws_ping_*: WebSocket keepalive for /ws (frontend) and /device-agent; higher timeout helps high-latency/mobile clients
web:
  host: "0.0.0.0"
  port: 8081
  ws_ping_interval: 20   # seconds between server pings
  ws_ping_timeout: 120   # seconds to wait for pong (increase if "keepalive ping timeout" in logs)


ports:
  base_port: 20000
  stride: 10

# ─── ADB (chỉ dùng cho agent.py khi dev local) ───────────────────────────────
# Server KHÔNG dùng ADB binary. Khi deploy lên cloud chỉ dùng STFService.apk trên thiết bị.
adb:
  path: "adb"            # Chỉ dùng bởi agent.py (PC), không dùng bởi server
  ping_timeout: 5
  connect_timeout: 10

# ─── Wireless ADB / adb-shell transport (Mode B — no adb binary) ─────────────
# Farm server kết nối thẳng đến device adbd qua TCP dùng thư viện adb-shell.
# Không cần cài adb binary trên server. Không cần USB.
#
# Yêu cầu trên device:
#   Android 11+: Settings → Developer Options → Wireless Debugging → Enable
#                Lần đầu: pair RSA key (device show "Allow ADB?" dialog)
#   Android ≤10: Chạy `adb tcpip 5555` một lần qua USB, sau đó rút USB
#
# ─── Device Setup ────────────────────────────────────────────────────────────
device:
  # File that maps device serial → slot index (for port persistence)
  index_file: "device_index.json"

  minitouch_bin: "/data/local/tmp/minitouch"

  # STFService APK package name
  stf_package: "jp.co.cyberagent.stf"
  stf_apk_path: ""       # Leave empty; installer will detect from 'pm path'

  # scrcpy-server JAR path on HOST machine (from brew install scrcpy)
  # Used by agent.py (PC/ADB) for high-FPS stream. STFService/agent_local use MediaProjection.
  # macOS: /opt/homebrew/share/scrcpy/scrcpy-server
  # Linux: /usr/share/scrcpy/scrcpy-server
  scrcpy_jar: "/opt/homebrew/share/scrcpy/scrcpy-server"
  scrcpy_max_fps: 60       # max FPS (sent to agent via stream_options)
  scrcpy_max_width: 800   # downscale width (0 = native resolution)
  scrcpy_bitrate: 8000000  # H.264 bitrate bps (8Mbps). Use 2–4M when behind ngrok to avoid "Network bandwidth exceeded"

# ─── Device Mode Override ────────────────────────────────────────────────────
# force_u2_mode: true  → skip minitouch/STF; tap qua u2 only.
# force_u2_mode: false → dùng minitouch + u2 (mặc định)
force_u2_mode: false

# ─── Target Application ──────────────────────────────────────────────────────
# Leave empty to skip app monitoring in watchdog
target_app: ""           # e.g., "com.example.mygame"

# ─── Watchdog ────────────────────────────────────────────────────────────────
watchdog:
  interval: 10           # check every N seconds
  max_retries: 3         # after this many failed reconnects → mark DEAD
  frame_stale_threshold: 5  # frame older than N seconds → unhealthy
  u2_health_timeout: 5   # seconds for d.info call

# ─── Dispatcher ───────────────────────────────────────────────────────────────
dispatcher:
  loop_interval: 0.5     # seconds between dispatch loops
  max_tasks_per_minute: 60  # rate limit per device

# ─── Task Defaults ────────────────────────────────────────────────────────────
task:
  default_timeout: 300   # seconds
  default_max_retries: 2
  default_priority: 5    # lower number = higher priority


# ─── PostgreSQL Database ──────────────────────────────────────────────────────
# Set enabled: true and configure connection details to activate DB integration.
# Alternatively set DATABASE_URL env var:
#   export DATABASE_URL=postgresql://user:pass@localhost:5432/device_farm
database:
  enabled: true
  host: "localhost"
  port: 5432
  name: "device_farm"
  user: "hoanglcpila.vn"
  password: "postgres"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"          
  format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"

u2:
  screenshot_interval: 0.25   
  implicitly_wait: 10.0
  wait_timeout: 20.0
  operation_delay: [0, 0.1]   
