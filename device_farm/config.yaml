
web:
  host: "0.0.0.0"
  port: 8081
  ws_ping_interval: 20  
  ws_ping_timeout: 30   


ports:
  base_port: 20000
  stride: 10

adb:
  path: "adb"            
  ping_timeout: 5
  connect_timeout: 10

device:
  index_file: "device_index.json"

  minitouch_bin: "/data/local/tmp/minitouch"

  stf_package: "jp.co.cyberagent.stf"
  stf_apk_path: ""       

  scrcpy_jar: "/opt/homebrew/share/scrcpy/scrcpy-server"
  scrcpy_max_fps: 20      
  scrcpy_max_width: 800   # downscale max dimension
  scrcpy_bitrate: 8000000  # H.264 bitrate bps (8Mbps). Use 2–4M when behind ngrok to avoid "Network bandwidth exceeded"
  scrcpy_control: true     # Enable scrcpy control channel for touch/key/text (smoothest input method)

force_u2_mode: true

# Leave empty to skip app monitoring in watchdog
target_app: ""           # e.g., "com.example.mygame"

# ─── Watchdog ────────────────────────────────────────────────────────────────
watchdog:
  interval: 10           # check every N seconds
  max_retries: 3         # after this many failed reconnects → mark DEAD
  frame_stale_threshold: 5  # frame older than N seconds → unhealthy
  u2_health_timeout: 5   # seconds for d.info call

# ─── Dispatcher ───────────────────────────────────────────────────────────────
dispatcher:
  loop_interval: 0.5     # seconds between dispatch loops
  max_tasks_per_minute: 60  # rate limit per device

# ─── Task Defaults ────────────────────────────────────────────────────────────
task:
  default_timeout: 300   # seconds
  default_max_retries: 2
  default_priority: 5    # lower number = higher priority


# ─── PostgreSQL Database ──────────────────────────────────────────────────────
# Set enabled: true and configure connection details to activate DB integration.
# Alternatively set DATABASE_URL env var:
#   export DATABASE_URL=postgresql://user:pass@localhost:5432/device_farm
database:
  enabled: true
  host: "localhost"
  port: 5432
  name: "device_farm"
  user: "hoanglcpila.vn"
  password: "password"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"          
  format: "%(asctime)s [%(levelname)s] [%(name)s] %(message)s"

u2:
  screenshot_interval: 0.25
  implicitly_wait: 10.0
  wait_timeout: 20.0
  operation_delay: [0, 0.1]

# ─── Streaming ──────────────────────────────────────────────────────────────
# mode: "periodic" = server captures screenshots on interval (low CPU/bandwidth)
#        "continuous" = legacy 30FPS streaming via agent/scrcpy
streaming:
  mode: "periodic"
  dashboard_interval: 3.0    # seconds between dashboard screenshot refreshes (scrcpy pushes frames directly)

# Temporal workflow engine (optional).
# Set enabled: true only when Temporal server is running.
# When disabled, campaigns fall back to the in-process TaskQueue automatically.
# Start server: docker run -p 7233:7233 temporalio/auto-setup:latest
temporal:
  enabled: true                        # Set true to use Temporal
  server_url: "localhost:7233"          # Temporal gRPC endpoint
  namespace: "default"
  task_queue: "device-scenario"
  worker_max_concurrent_activities: 10  # Max parallel device actions per worker
  worker_max_concurrent_workflows: 50   # Max parallel workflow tasks per worker
  workflow_execution_timeout: 3600      # Max seconds for one campaign workflow
  activity_start_to_close_timeout: 60   # Max seconds per device action
  activity_retry_max_attempts: 3        # Retry failed device actions
  activity_retry_initial_interval: 1.0  # First retry delay (seconds)
  activity_retry_max_interval: 30.0     # Max retry delay (seconds)
  activity_retry_backoff: 2.0           # Exponential backoff multiplier
