syntax = "proto3";
package devicefarm;

// Sent by agent-boot → device_farm (replaces the 0x53 binary frame)
message VideoFrame {
  string serial    = 1;  // device serial (e.g. "192.168.1.10:5555")
  bytes  data      = 2;  // H264 payload (AVCC format)
  bool   is_config = 3;  // SPS/PPS config NAL (was flags bit0)
  bool   is_key    = 4;  // IDR keyframe (was flags bit1)
  int64  pts_us    = 5;  // presentation timestamp µs
  uint32 width     = 6;  // screen width (only on is_config frames)
  uint32 height    = 7;  // screen height (only on is_config frames)
}

// Sent by device_farm → agent-boot (scrcpy control bytes OR JSON commands)
message ControlMsg {
  string serial  = 1;  // target device serial
  bytes  data    = 2;  // raw scrcpy control bytes OR JSON command bytes
  bool   is_json = 3;  // true → data is JSON (scrcpy_start, command, ack, etc.)
}

// Sent by agent-boot → device_farm: video frame OR JSON control message
// (register / heartbeat / result go as meta)
message AgentMsg {
  oneof payload {
    VideoFrame video = 1;  // H264 frames (high-frequency, ~30fps per phone)
    bytes      meta  = 2;  // JSON bytes: register / heartbeat / result (low-frequency)
  }
}

service RelayService {
  // Single bidirectional stream per agent-boot instance.
  // Agent sends AgentMsgs (video + JSON); farm sends ControlMsgs (control + JSON commands).
  rpc Stream(stream AgentMsg) returns (stream ControlMsg);
}

// ── Control plane (separate stream, low-volume) ───────────────────────────────
// Runs on the same gRPC port as RelayService but as an independent HTTP/2 stream.
// This keeps identity + command traffic off the high-throughput video stream.

service AgentControlService {
  rpc ControlStream(stream AgentControlMsg) returns (stream ServerControlMsg);
}

// Agent → Server
message AgentControlMsg {
  oneof payload {
    RegisterMsg      register  = 1;
    HeartbeatMsg     heartbeat = 2;
    CommandResultMsg result    = 3;
  }
}

message RegisterMsg {
  string          relay_id      = 1;
  repeated string serials       = 2;
  string          hostname      = 3;
  string          ip            = 4;
  string          agent_version = 5;
}

message HeartbeatMsg {
  string          relay_id = 1;
  repeated string serials  = 2;
  repeated DeviceCaps caps = 3;
}

message DeviceCaps {
  string serial          = 1;
  string android_version = 2;
  int32  sdk             = 3;
  string brand           = 4;
  string model           = 5;
  bool   has_u2          = 6;
  bool   has_stf         = 7;
}

message CommandResultMsg {
  string msg_id    = 1;
  bool   ok        = 2;
  int32  exit_code = 3;
  string output    = 4;
  string error     = 5;
}

// Server → Agent
message ServerControlMsg {
  oneof payload {
    RegisterAck      ack            = 1;
    BootstrapCmd     bootstrap      = 2;
    RestartU2Cmd     restart_u2     = 3;
    RestartAtxCmd    restart_atx    = 4;
    ShellCmd         shell          = 5;
    RestartScrcpyCmd restart_scrcpy = 6;
  }
}

message RegisterAck      { string message = 1; }
message BootstrapCmd     { string msg_id = 1; string serial = 2; int32 timeout = 3; }
message RestartU2Cmd     { string msg_id = 1; string serial = 2; int32 timeout = 3; }
message RestartAtxCmd    { string msg_id = 1; string serial = 2; int32 timeout = 3; }
message ShellCmd         { string msg_id = 1; string serial = 2; string cmd = 3; int32 timeout = 4; }
message RestartScrcpyCmd { string msg_id = 1; string serial = 2; int32 timeout = 3; }
