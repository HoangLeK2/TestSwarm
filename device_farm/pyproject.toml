[project]
name = "device-farm"
version = "1.0.0"
description = "Android Device Farm — screen streaming, touch injection, task dispatch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # ── ADB transport (requires system `adb` binary) ──
    "cryptography>=41.0.0",       # Fernet encryption (common/crypto.py)
    "zeroconf>=0.132.0",          # mDNS discovery for Android 11+ Wireless Debugging
    # ─────────────────────────────────
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "casbin>=1.43.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "protobuf>=5.26.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "av>=12.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=3.2.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy[asyncio]>=2.0.0",
    # Cap <0.31: 0.31.0 has native SIGSEGV reports (e.g. with Temporal worker same process).
    "asyncpg>=0.30.0,<0.31",
    "openai>=2.26.0",
    "google-generativeai>=0.8.6",
    "lxml>=5.0.0",                # fast XML + XPath for UIAutomator2 hierarchy parsing
    "python-dotenv>=1.2.2",
    "pyngrok>=7.0.0",
    "tenacity>=8.2.0",            # retry-until-visible for scenario steps
    "airtest>=1.3.0",                 # Airtest aircv: SSIM + template matching for visual anchoring
    # ── Object storage ──
    "minio>=7.2.0",               # S3-compatible client (R2, MinIO, …) for screenshots
    # ── Temporal workflow orchestration (DF-002) ──
    "temporalio>=1.7.1",
    # ── Scheduler & Cron (DF-008) ──
    "croniter>=2.0.0",             # cron expression parsing + next_run_at computation
    "pytz>=2024.1",                # timezone-aware datetime for cron schedules
    # ADB relay uses WebSocket on /relay-agent (no gRPC dependency needed)
    # ── Export ──
    "openpyxl>=3.1.0",            # XLSX streaming export for content pipeline
    "prometheus-fastapi-instrumentator>=7.0.0",
    "redis[hiredis]>=5.0.0",
    "grpcio>=1.78.0",
    "grpcio-tools>=1.71.2",
    "fractional-indexing>=0.1.0",
    "structlog>=24.4.0",
    # ── Crawling enhancement (Phase 0 — research_mobile_crawl_libraries_2025.md) ──
    "dateparser>=1.2",            # Parse "5 phút trước", "2 hours ago" → datetime
    "orjson>=3.9",                # Fast JSON serialization (FastAPI default response)
    "xxhash>=3.4",                # Fast non-crypto hash (Phase 5 change detection / Bloom filter)
    "ftfy>=6.2",                  # Fix mojibake / weird Unicode from social media text
    "cssselect>=1.2",             # CSS selector → XPath translation for lxml
    "aiosmtplib>=3.0.0",          # async SMTP for org invite emails
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]
# Heavy OCR backend — install via `pip install device-farm[ocr]` or skip and rely on Tesseract subprocess
ocr = [
    "paddlepaddle>=2.6",
    "paddleocr>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "templates"

[project.scripts]
device-farm = "main:main"
export-openapi = "export_openapi:main"

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
override-dependencies = [
    # Airtest pins old opencv/numpy — override for Python 3.14 compat
    "opencv-contrib-python>=4.10.0",
    "numpy>=1.24.0",
    "pywin32>=300; sys_platform == 'win32'",
    "pywinauto>=0.6.3; sys_platform == 'win32'",
    "mss>=9.0.0",
    "six>=1.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "croniter>=6.2.2",
    "pytest-asyncio>=1.3.0",
    "pytz>=2026.1.post1",
]
