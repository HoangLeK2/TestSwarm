# Android Platform Tester — production stack
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f farm   # follow backend logs
#   docker compose down            # stop all
#
# Services:
#   farm       — Backend API + Temporal worker + gRPC relay (8081, 50051 → host)
#   frontend   — Next.js dashboard (port 3000)
#   temporal   — Temporal Server (port 7233, UI: 8233) — uses external Postgres
#   go2rtc     — WebRTC/RTSP media gateway (1984 local API, 8554 RTSP, 8555 ICE/WebRTC)
#   postgres   — Disabled by default. Bring your own Postgres (set DB_HOST in .env).
#                Uncomment block below to run a local Postgres.
#
# DB config (read from .env in this directory, all have fallbacks):
#   ANDROID_PLATFORM_TESTER_DATABASE_URL (required, dedicated database)
#   ANDROID_PLATFORM_TESTER_DB_* (Postgres/Temporal connection settings)
#
# agent-boot (local relay): run manually on the machine with ADB:
#   cd agent-boot && RELAY_MODE=grpc uv run main.py --relay-server <host>:50051 --relay-api-key <KEY>

name: android-platform-tester

services:
  # ─── Local Postgres (DISABLED — bring your own) ───────────────────────────
  # Uncomment to run Postgres inside compose. Then set DB_HOST=postgres in .env.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${ANDROID_PLATFORM_TESTER_DB_NAME:-android_platform_tester}
  #     POSTGRES_USER: ${ANDROID_PLATFORM_TESTER_DB_USER:-platform_tester}
  #     POSTGRES_PASSWORD: ${ANDROID_PLATFORM_TESTER_DB_PASSWORD:-platform_tester}
  #   ports:
  #     - "${ANDROID_PLATFORM_TESTER_DB_PORT_PUBLISHED:-55434}:5432"
  #   volumes:
  #     - android_platform_tester_pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${ANDROID_PLATFORM_TESTER_DB_USER:-platform_tester} -d ${ANDROID_PLATFORM_TESTER_DB_NAME:-android_platform_tester}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=${ANDROID_PLATFORM_TESTER_DB_PORT:-5432}
      - POSTGRES_USER=${ANDROID_PLATFORM_TESTER_DB_USER:-platform_tester}
      - POSTGRES_PWD=${ANDROID_PLATFORM_TESTER_DB_PASSWORD:-platform_tester}
      - POSTGRES_SEEDS=${ANDROID_PLATFORM_TESTER_DB_HOST:-host.docker.internal}
      - SQL_MAX_CONNS=${TEMPORAL_SQL_MAX_CONNS:-5}
      - SQL_MAX_IDLE_CONNS=${TEMPORAL_SQL_MAX_IDLE_CONNS:-5}
      - SQL_VIS_MAX_CONNS=${TEMPORAL_SQL_VIS_MAX_CONNS:-3}
      - SQL_VIS_MAX_IDLE_CONNS=${TEMPORAL_SQL_VIS_MAX_IDLE_CONNS:-3}
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7233:7233"   # gRPC (worker + client)
    volumes:
      - ./temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"   # Temporal UI at http://localhost:8233

  go2rtc:
    # Opt-in. The Singapore host already runs a standalone `go2rtc` container on
    # host networking, and starting this one alongside it would collide on 8554
    # and 8555. Left out of the default set so `up -d` deploys farm without
    # touching that container; bring it up deliberately with:
    #   docker compose --profile go2rtc up -d
    # See docs/deploy-media-cloud.md for which of the two paths you are on.
    profiles: ["go2rtc"]
    image: ${GO2RTC_IMAGE:-ghcr.io/alexxit/go2rtc:1.9.14}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # go2rtc does not expand ${VAR} inside go2rtc.yaml, so deployment values are
    # passed as a second -config that overrides the file.
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - '{"rtsp":{"username":"${RTSP_USER:?configure RTSP_USER — 8554 is internet-facing}","password":"${RTSP_PASS:?configure RTSP_PASS — 8554 is internet-facing}"},"webrtc":{"candidates":[${GO2RTC_WEBRTC_CANDIDATES:-"stun:8555"}]}}'
    ports:
      # No 1984 here: farm reaches the API over the compose network as
      # http://go2rtc:1984, and media-adapter no longer calls it at all.
      # 8554 = RTSP ingest (media-adapter pushes in), 8555 = WebRTC media.
      - "${GO2RTC_RTSP_PORT:-8554}:8554/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"
    volumes:
      - ./infra/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  farm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    env_file:
      - ./.env
    depends_on:
      temporal:
        condition: service_healthy
    # No dependency on go2rtc: it may be the standalone container rather than a
    # compose service, and farm does not need it at boot anyway — it is called
    # per session and the failure is reported to that one viewer.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bridge network (default): works on Docker Desktop Mac/Windows. Agent-boot on the
    # host uses localhost:8081 and localhost:50051 via published ports below.
    ports:
      - "8081:8081"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 6G
    environment:
      # Required, project-specific DSN. Generic DATABASE_URL and DB_* are
      # intentionally ignored by the backend.
      ANDROID_PLATFORM_TESTER_DATABASE_URL: ${ANDROID_PLATFORM_TESTER_DATABASE_URL:?Set the dedicated Platform Tester database URL}
      TEMPORAL_SERVER_URL: temporal:7233
      # Parallel Temporal worker threads (each has own event loop + activity DB pool).
      # 7 × 20 = 140 slots: 120 target devices plus 20 slots for finalize/control.
      TEMPORAL_WORKER_COUNT: ${TEMPORAL_WORKER_COUNT:-6}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_EXPIRE_HOURS: ${ACCESS_EXPIRE_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Cloudflare R2 (ưu tiên). Để trống nếu chỉ lưu local / dùng presigned.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-device-farm}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SECURE: ${R2_SECURE:-}
      R2_PUBLIC_URL_INCLUDE_BUCKET: ${R2_PUBLIC_URL_INCLUDE_BUCKET:-}
      R2_REGION: ${R2_REGION:-}
      OBJECT_STORAGE_MAX_CONCURRENT_UPLOADS: ${OBJECT_STORAGE_MAX_CONCURRENT_UPLOADS:-8}
      DEVICE_FARM_LOCAL_IMAGE_FALLBACK_ENABLED: ${DEVICE_FARM_LOCAL_IMAGE_FALLBACK_ENABLED:-false}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_PORT: ${RELAY_PORT:-50051}
      DEVICE_FARM_U2_ALWAYS_TUNNEL: ${DEVICE_FARM_U2_ALWAYS_TUNNEL:-1}
      DEVICE_FARM_SCRCPY_JAR: ${DEVICE_FARM_SCRCPY_JAR:-/usr/share/scrcpy/scrcpy-server}
      DEVICE_FARM_WEBRTC_ENABLED: ${DEVICE_FARM_WEBRTC_ENABLED:-1}
      MEDIA_ADAPTER_CONTROL_PLANE: ${MEDIA_ADAPTER_CONTROL_PLANE:-grpc}
      DEVICE_FARM_GO2RTC_URL: ${DEVICE_FARM_GO2RTC_URL:-http://go2rtc:1984}
      MEDIA_WEBRTC_SIGNALING_PLANE: ${MEDIA_WEBRTC_SIGNALING_PLANE:-backend}
      ACCOUNT_VERIFICATION_MODE: ${ACCOUNT_VERIFICATION_MODE:-shadow}
      ACCOUNT_VERIFICATION_CONCURRENCY: ${ACCOUNT_VERIFICATION_CONCURRENCY:-8}
      ACCOUNT_VERIFICATION_TIMEOUT_SECONDS: ${ACCOUNT_VERIFICATION_TIMEOUT_SECONDS:-6}
      ACCOUNT_ACTION_LEDGER_MODE: ${ACCOUNT_ACTION_LEDGER_MODE:-disabled}
      ACCOUNT_ACTION_RECONCILE_INTERVAL_SECONDS: ${ACCOUNT_ACTION_RECONCILE_INTERVAL_SECONDS:-60}
      ACCOUNT_ACTION_RECONCILE_STALE_AFTER_SECONDS: ${ACCOUNT_ACTION_RECONCILE_STALE_AFTER_SECONDS:-3600}
      PLATFORM_VERIFICATION_PACKAGE: ${PLATFORM_VERIFICATION_PACKAGE:-}
      PLATFORM_VERIFICATION_RESOURCE_ID: ${PLATFORM_VERIFICATION_RESOURCE_ID:-}
      # Web/API pool: 12 persistent + 3 burst connections.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      EDGE_INGEST_POOL_SIZE: ${EDGE_INGEST_POOL_SIZE:-4}
      EDGE_INGEST_CONCURRENCY: ${EDGE_INGEST_CONCURRENCY:-4}
      EDGE_INGEST_QUEUE_TIMEOUT: ${EDGE_INGEST_QUEUE_TIMEOUT:-2}
      EDGE_INGEST_MAX_BATCH_BYTES: ${EDGE_INGEST_MAX_BATCH_BYTES:-16777216}
      EDGE_INGEST_MAX_ITEMS: ${EDGE_INGEST_MAX_ITEMS:-5000}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      # Keep total activity DB demand bounded independently of activity slots.
      DB_ACTIVITY_POOL_SIZE: ${DB_ACTIVITY_POOL_SIZE:-4}
      DB_ACTIVITY_MAX_OVERFLOW: ${DB_ACTIVITY_MAX_OVERFLOW:-0}
      DB_ACTIVITY_POOL_TIMEOUT: ${DB_ACTIVITY_POOL_TIMEOUT:-30}
      # Required in production so an unsafe aggregate pool budget fails fast.
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:?Set DB_CONNECTION_LIMIT to PostgreSQL max_connections}
      DB_CONNECTION_RESERVE: ${DB_CONNECTION_RESERVE:-15}
      TEMPORAL_DB_MAX_CONNECTIONS: ${TEMPORAL_DB_MAX_CONNECTIONS:-40}
      METRICS_ENABLED: ${METRICS_ENABLED:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      EXECUTION_EVENT_OUTBOX_LEASE_SECONDS: ${EXECUTION_EVENT_OUTBOX_LEASE_SECONDS:-30}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - farm_captures:/app/captures
      # scenario-trace.log — the account activity trail. Without this it was
      # written inside the container and lost on every recreate, leaving
      # `docker compose logs` as the only copy.
      - farm_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRODUCT_API_URL: ${NEXT_PUBLIC_PRODUCT_API_URL:-http://host.docker.internal:8081}
        NEXT_PUBLIC_DEVICE_FARM_WS_URL: ${NEXT_PUBLIC_DEVICE_FARM_WS_URL:-ws://host.docker.internal:8081/ws}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_DISABLED: ${NEXT_PUBLIC_SENTRY_DISABLED:-1}
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      farm:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_PRODUCT_API_URL: ${NEXT_PUBLIC_PRODUCT_API_URL:-http://host.docker.internal:8081}
      NEXT_PUBLIC_DEVICE_FARM_WS_URL: ${NEXT_PUBLIC_DEVICE_FARM_WS_URL:-ws://host.docker.internal:8081/ws}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
      LOW_BW_MODE: ${LOW_BW_MODE:-true}
      LOW_BW_FRAME_SKIP: ${LOW_BW_FRAME_SKIP:-2}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DISABLED: ${NEXT_PUBLIC_SENTRY_DISABLED:-1}

  # ─── MinIO (local S3) — tắt mặc định; bỏ # để dùng lại + uncomment minio_data volume ───
  # minio:
  #   profiles:
  #     - minio
  #   image: minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 5s

volumes:
  android_platform_tester_pgdata:
  farm_captures:
  farm_logs:
  # minio_data:
