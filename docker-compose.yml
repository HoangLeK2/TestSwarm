# Device Farm — Full Stack
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f farm   # follow backend logs
#   docker compose down            # stop all
#
# Services:
#   farm       — Backend API + Temporal worker + gRPC relay (8081, 50051 → host)
#   frontend   — Next.js dashboard (port 3000)
#   postgres   — PostgreSQL (host port 5443 → container 5432; avoid clash with local PG)
#   temporal   — Temporal Server (port 7233, UI: 8233)
#   redis-ui   — Redis web UI (port 5540 → browse keys / MONITOR-lite)
#   minio — đã comment; bật lại khi cần S3 local (kèm volume minio_data).
#
# DB config (read from .env in this directory, all have fallbacks):
#   DB_HOST (default: host.docker.internal — external Postgres on the host)
#   DB_PORT (5432)
#   DB_NAME (device_farm)
#   DB_USER (postgres)
#   DB_PASSWORD (postgres)
#
# agent-boot (local relay): run manually on the machine with ADB:
#   cd agent-boot && RELAY_MODE=grpc uv run main.py --relay-server <host>:50051 --relay-api-key <KEY>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-device_farm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_PUBLISHED:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=${DB_HOST:-host.docker.internal}
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7233:7233"   # gRPC (worker + client)
    volumes:
      - ./temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"   # Temporal UI at http://localhost:8233

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_UI_PORT:-5540}:8081"

  farm:
    build:
      context: ./device_farm
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-device_farm}}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-device_farm}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      TEMPORAL_SERVER_URL: temporal:7233
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_EXPIRE_HOURS: ${ACCESS_EXPIRE_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Cloudflare R2 (ưu tiên). Để trống nếu chỉ lưu local / dùng presigned.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-device-farm}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SECURE: ${R2_SECURE:-}
      R2_PUBLIC_URL_INCLUDE_BUCKET: ${R2_PUBLIC_URL_INCLUDE_BUCKET:-}
      R2_REGION: ${R2_REGION:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_PORT: ${RELAY_PORT:-50051}
      DEVICE_FARM_U2_ALWAYS_TUNNEL: ${DEVICE_FARM_U2_ALWAYS_TUNNEL:-1}
      DEVICE_FARM_SCRCPY_JAR: ${DEVICE_FARM_SCRCPY_JAR:-/usr/share/scrcpy/scrcpy-server}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - farm_captures:/app/captures
      - ./device_farm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PRODUCT_API_URL: ${NEXT_PUBLIC_PRODUCT_API_URL:-http://host.docker.internal:8081}
        NEXT_PUBLIC_DEVICE_FARM_WS_URL: ${NEXT_PUBLIC_DEVICE_FARM_WS_URL:-ws://host.docker.internal:8081/ws}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_DISABLED: ${NEXT_PUBLIC_SENTRY_DISABLED:-1}
    env_file:
      - ./.env
    restart: unless-stopped
    depends_on:
      farm:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_PRODUCT_API_URL: ${NEXT_PUBLIC_PRODUCT_API_URL:-http://host.docker.internal:8081}
      NEXT_PUBLIC_DEVICE_FARM_WS_URL: ${NEXT_PUBLIC_DEVICE_FARM_WS_URL:-ws://host.docker.internal:8081/ws}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
      DEVICE_FARM_BACKEND_URL: ${DEVICE_FARM_BACKEND_URL:-http://farm:8081}
      LOW_BW_MODE: ${LOW_BW_MODE:-true}
      LOW_BW_FRAME_SKIP: ${LOW_BW_FRAME_SKIP:-2}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DISABLED: ${NEXT_PUBLIC_SENTRY_DISABLED:-1}

  # ─── Observability (tạm tắt Prometheus/Grafana vì BE chưa dùng) ───
  # prometheus:
  #   image: prom/prometheus:latest
  #   restart: unless-stopped
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 5s

volumes:
  pgdata:
  farm_captures:
  minio_data:
  redis_data:
  # prometheus_data:
  # grafana_data:
