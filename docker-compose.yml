# Device Farm — Full Stack
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f farm   # follow backend logs
#   docker compose down            # stop all
#
# Services:
#   farm       — Backend API + Temporal worker + gRPC relay (published 8081, 50051 → host)
#   frontend   — Next.js dashboard (port 3000)
#   postgres   — PostgreSQL (host port 5433 → container 5432; avoid clash with local PG)
#   temporal   — Temporal Server (port 7233, UI: 8233)
#   minio — đã comment; bật lại khi cần S3 local (kèm volume minio_data).
#
# agent-boot (local relay):
#   Runs on the physical machine that has ADB access to devices.
#   NOT a docker service — run manually:
#     # gRPC mode (recommended for ≥5 phones — HTTP/2 multiplexing):
#     cd agent-boot && RELAY_MODE=grpc uv run main.py --relay-server <host>:50051 --relay-api-key <KEY>
#     # WebSocket mode (legacy fallback):
#     cd agent-boot && uv run main.py --relay-server ws://<host>:8081/relay-agent --relay-api-key <KEY>
#   It connects outbound to farm and proxies ADB + scrcpy.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: device_farm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5


  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"   # gRPC (worker + client)
    volumes:
      - ./temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"   # Temporal UI at http://localhost:8233

  farm:
    build:
      context: ./device_farm
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./device_farm/.env
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # Bridge network (default): works on Docker Desktop Mac/Windows. Agent-boot on the
    # host uses localhost:8081 and localhost:50051 via published ports below.
    # On Linux bare metal you can switch to network_mode: host + 127.0.0.1:* URLs if you want lower NAT overhead.
    ports:
      - "8081:8081"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/device_farm
      TEMPORAL_SERVER_URL: temporal:7233
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_EXPIRE_HOURS: ${ACCESS_EXPIRE_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Cloudflare R2 (ưu tiên). Để trống nếu chỉ lưu local / dùng presigned.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-device-farm}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SECURE: ${R2_SECURE:-}
      R2_PUBLIC_URL_INCLUDE_BUCKET: ${R2_PUBLIC_URL_INCLUDE_BUCKET:-}
      R2_REGION: ${R2_REGION:-}
      # Legacy MinIO / S3 env (bật khi trỏ tới MinIO ngoài compose)
      # MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      # MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      # MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      # MINIO_BUCKET: ${MINIO_BUCKET:-}
      # MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_PORT: ${RELAY_PORT:-50051}
      DEVICE_FARM_U2_ALWAYS_TUNNEL: ${DEVICE_FARM_U2_ALWAYS_TUNNEL:-1}
      DEVICE_FARM_SCRCPY_JAR: ${DEVICE_FARM_SCRCPY_JAR:-/usr/share/scrcpy/scrcpy-server}
    volumes:
      - ./device_farm/config.yaml:/app/config.yaml:ro
      - farm_captures:/app/captures
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      farm:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://farm:8081
      NEXT_PUBLIC_WS_URL: ws://farm:8081

