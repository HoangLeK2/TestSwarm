# Device Farm — Full Stack
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f farm   # follow backend logs
#   docker compose down            # stop all
#
# Services:
#   farm       — Backend API + Temporal worker + gRPC relay (8081, 50051 → host)
#   frontend   — Next.js dashboard (port 3000)
#   postgres   — PostgreSQL (host port 5443 → container 5432; avoid clash with local PG)
#   temporal   — Temporal Server (port 7233, UI: 8233)
#   redis-ui   — Redis web UI (port 5540 → browse keys / MONITOR-lite)
#   minio      — Optional local S3 (profile `minio`: API :9000, console :9001). Cloud dùng R2.
#
# DB config (read from .env in this directory, all have fallbacks):
#   DB_HOST (default: host.docker.internal — external Postgres on the host)
#   DB_PORT (5432)
#   DB_NAME (device_farm)
#   DB_USER (postgres)
#   DB_PASSWORD (postgres)
#
# agent-boot (local relay): run manually on the machine with ADB:
#   cd agent-boot && RELAY_MODE=grpc uv run main.py --relay-server <host>:50051 --relay-api-key <KEY>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-device_farm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_PUBLISHED:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PWD=${DB_PASSWORD:-postgres}
      - POSTGRES_SEEDS=${DB_HOST:-host.docker.internal}
      - SQL_MAX_CONNS=${TEMPORAL_SQL_MAX_CONNS:-5}
      - SQL_MAX_IDLE_CONNS=${TEMPORAL_SQL_MAX_IDLE_CONNS:-5}
      - SQL_VIS_MAX_CONNS=${TEMPORAL_SQL_VIS_MAX_CONNS:-3}
      - SQL_VIS_MAX_IDLE_CONNS=${TEMPORAL_SQL_VIS_MAX_IDLE_CONNS:-3}
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7233:7233"   # gRPC (worker + client)
    volumes:
      - ./temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"   # Temporal UI at http://localhost:8233

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_UI_PORT:-5540}:8081"

  farm:
    build:
      context: ./device_farm
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 6G
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-device_farm}}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-device_farm}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      TEMPORAL_SERVER_URL: temporal:7233
      # Parallel Temporal worker threads (each has own event loop + activity DB pool).
      # 7 × 20 = 140 slots: 120 target devices plus 20 slots for finalize/control.
      TEMPORAL_WORKER_COUNT: ${TEMPORAL_WORKER_COUNT:-6}
      TEMPORAL_WORKER_MAX_CONCURRENT_ACTIVITIES: ${TEMPORAL_WORKER_MAX_CONCURRENT_ACTIVITIES:-20}
      TEMPORAL_WORKER_MAX_CONCURRENT_WORKFLOWS: ${TEMPORAL_WORKER_MAX_CONCURRENT_WORKFLOWS:-60}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_EXPIRE_HOURS: ${ACCESS_EXPIRE_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Cloudflare R2 (ưu tiên). Để trống nếu chỉ lưu local / dùng presigned.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-device-farm}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_SECURE: ${R2_SECURE:-}
      R2_PUBLIC_URL_INCLUDE_BUCKET: ${R2_PUBLIC_URL_INCLUDE_BUCKET:-}
      R2_REGION: ${R2_REGION:-}
      DEVICE_FARM_CONTENT_IMAGES_ENABLED: ${DEVICE_FARM_CONTENT_IMAGES_ENABLED:-0}
      # MinIO tắt khi dùng R2 — chỉ set MINIO_* trong .env khi chạy profile `minio`.
      # MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      # MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      # MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      # MINIO_BUCKET: ${MINIO_BUCKET:-}
      # MINIO_SECURE: ${MINIO_SECURE:-}
      # MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      # MINIO_PUBLIC_URL_INCLUDE_BUCKET: ${MINIO_PUBLIC_URL_INCLUDE_BUCKET:-}
      OBJECT_STORAGE_MAX_CONCURRENT_UPLOADS: ${OBJECT_STORAGE_MAX_CONCURRENT_UPLOADS:-8}
      DEVICE_FARM_LOCAL_IMAGE_FALLBACK_ENABLED: ${DEVICE_FARM_LOCAL_IMAGE_FALLBACK_ENABLED:-false}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_PORT: ${RELAY_PORT:-50051}
      DEVICE_FARM_U2_ALWAYS_TUNNEL: ${DEVICE_FARM_U2_ALWAYS_TUNNEL:-1}
      DEVICE_FARM_SCRCPY_JAR: ${DEVICE_FARM_SCRCPY_JAR:-/usr/share/scrcpy/scrcpy-server}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Web/API pool: 12 persistent + 3 burst connections. With the documented
      # seven activity workers this keeps the full DB budget at 98/100.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      # Each of the seven activity event loops gets a bounded pool; activity slots queue
      # for DB access instead of exhausting a PostgreSQL instance shared with Temporal.
      DB_ACTIVITY_POOL_SIZE: ${DB_ACTIVITY_POOL_SIZE:-4}
      DB_ACTIVITY_MAX_OVERFLOW: ${DB_ACTIVITY_MAX_OVERFLOW:-0}
      DB_ACTIVITY_POOL_TIMEOUT: ${DB_ACTIVITY_POOL_TIMEOUT:-30}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-100}
      DB_CONNECTION_RESERVE: ${DB_CONNECTION_RESERVE:-15}
      TEMPORAL_DB_MAX_CONNECTIONS: ${TEMPORAL_DB_MAX_CONNECTIONS:-40}
      METRICS_ENABLED: ${METRICS_ENABLED:-0}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      EXECUTION_EVENT_OUTBOX_LEASE_SECONDS: ${EXECUTION_EVENT_OUTBOX_LEASE_SECONDS:-30}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      # Reconcile idempotent migration file drift on local Docker volumes (015 edited after first apply).
      MIGRATION_RECONCILE_DRIFT: ${MIGRATION_RECONCILE_DRIFT:-1}
    volumes:
      - farm_captures:/app/captures
      - ./device_farm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

